plugins {
    id 'com.android.application'
}

android {
    namespace 'com.majdi.cinematicai'
    compileSdk 34

    defaultConfig {
        applicationId 'com.majdi.cinematicai'
        minSdk 29
        targetSdk 34
        // Each cloud build gets a higher version so it installs as an update
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1') + 1
        versionName "2.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        // Samsung Galaxy S25 Ultra is arm64; one ABI keeps the native runtime small
        ndk { abiFilters 'arm64-v8a' }
    }

    // models are memory-mapped/copied as-is: never compress them
    androidResources {
        noCompress 'onnx'
    }

    // Release key comes only from a protected GitHub secret (never stored in the repository).
    // Without it the APK is signed with a valid debug key.
    def releaseKeystore = System.getenv('SIGNING_KEYSTORE_FILE')
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storeType 'pkcs12'
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'majdi'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':engine')
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
