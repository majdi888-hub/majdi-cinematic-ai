name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MajdiCinematicAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MajdiCinematicAI
          path: MajdiCinematicAI.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Majdi Cinematic AI v1.0.${{ github.run_number }}
          body: ملف APK جاهز للتثبيت على Samsung S25 Ultra.
          files: MajdiCinematicAI.apk
          make_latest: true
